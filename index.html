<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EntrenaEnCasa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="EntrenaEnCasa">
<meta name="apple-mobile-web-app-title" content="EntrenaEnCasa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1020">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&display=swap">
<style>
/* Misma identidad (gris azulado, cobalto, Atkinson, maniquí de madera) con más profundidad,
   navegación al alcance del pulgar y dos columnas en tablet. */
/* Noche vibrante: lienzo índigo casi negro. Lima = acción principal y «hecho»; violeta = secundario y selección;
   cada zona del cuerpo tiene su color para orientarse (tiñe el escenario del maniquí). */
:root{
  --bg:#0F1020; --bg-2:#15172B; --surface:#1A1C33; --surface-2:#23264A; --line:#2F3360;
  --ink:#F3F4FF; --muted:#A7ABD0;
  --accent:#C6F432; --accent-hover:#D7FF5E; --accent-ink:#11130A; --accent-soft:#2A3519;
  --accent2:#9D8FFF; --accent2-ink:#0F1020; --accent2-soft:#2A2758;
  --wood:#DDAA76; --wood-far:#A8784C; --joint:#8A5A2C; --prop:#565C98; --floor:#2C3060; --mat:#3A3478; --db:#9D8FFF;
  --ok:#C6F432; --ok-ink:#11130A; --ok-soft:#263117; --danger:#FF7389;
  --sh-1:0 1px 2px rgb(0 0 0 / .35),0 8px 20px rgb(0 0 0 / .22);
  --sh-2:0 2px 6px rgb(0 0 0 / .4),0 20px 44px rgb(0 0 0 / .45);
  --sh-btn:0 2px 4px rgb(0 0 0 / .3),0 8px 22px rgb(198 244 50 / .22);
  --r:18px; --r-s:12px; --nav-h:76px;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif; /* cifras: ceros sin barra, muy legibles */
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1875rem/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  caret-color:var(--accent);accent-color:var(--accent);scrollbar-color:var(--line) transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.modo-entreno{overflow:hidden}
::selection{background:var(--accent-soft);color:var(--ink)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(2.1rem,5.5vw,3rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ico{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- Estructura y navegación ---------- */
.wrap{max-width:46rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;padding-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.marca-app{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--sh-btn)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:4px;background:var(--surface);
  box-shadow:0 -1px 0 var(--line),0 -12px 30px rgb(0 0 0 / .35);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-height:60px;border:0;background:none;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:2px;font-size:.95rem;font-weight:700;border-radius:16px}
.tabs .ico{width:60px;height:34px;padding:5px 18px;border-radius:999px;transition:background-color .2s,color .2s}
.tabs button[aria-pressed="true"]{color:var(--accent)}
.tabs button[aria-pressed="true"] .ico{background:var(--accent-soft)}

.stack{display:grid;gap:32px}
.stack-s{display:grid;gap:16px}
.intro{display:grid;gap:10px;justify-items:start}
.fecha{font-weight:700;color:var(--muted)}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.center{justify-content:center}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border-radius:999px;border:2px solid transparent;
  font-weight:700;text-decoration:none;transition:background-color .15s,box-shadow .15s,transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--sh-btn)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.big{min-height:64px;padding:0 32px;font-size:1.3rem}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;min-height:44px;padding:0 6px;color:var(--accent);font-weight:700;
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.link .ico{width:1.1em;height:1.1em}
.link.sutil{color:var(--muted);text-decoration:none;font-size:1rem}
@media (hover:hover){
  .btn.primary:hover{background:var(--accent-hover)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.soft:hover{background:color-mix(in srgb,var(--accent-soft) 82%,var(--accent))}
  .link.sutil:hover{color:var(--ink)}
}

/* ---------- Maniquí ---------- */
.figbox{background:var(--bg-2);border-radius:var(--r-s);aspect-ratio:1;overflow:hidden;max-width:100%}
.fig{display:block;width:100%;height:100%}
.fig.girar{cursor:grab;touch-action:pan-y}
.fig line{stroke-linecap:round}
.fig circle{stroke:none}
.fig .wood{stroke:var(--wood);fill:var(--wood)}
.fig .far{stroke:var(--wood-far);fill:var(--wood-far)}
.fig .joint{fill:var(--joint)}
.fig .fj{fill:var(--joint);opacity:.6}
.fig .db{fill:var(--db)}
.fig .dbin{fill:var(--prop)}
.fig .floor{fill:var(--floor)}
.fig .mat{fill:var(--mat)}
.fig .wall{fill:var(--prop);opacity:.45}
.fig .prop{fill:none;stroke:var(--prop);stroke-width:6;stroke-linecap:round}
.fig .propfill{fill:var(--prop)}

/* ---------- Rutinas ---------- */
.hero{display:grid;gap:24px;align-items:center}
.hero .figbox{background:var(--surface);border-radius:20px;width:100%;max-width:26rem;box-shadow:var(--sh-2)}
.hero-txt{display:grid;gap:16px}
.rutinas{display:grid;gap:16px}
.rcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:16px;display:grid;gap:16px;align-content:start}
.minis{display:flex;gap:8px;padding:10px;background:var(--bg-2);border-radius:var(--r-s);min-height:84px;align-items:center}
.minis .figbox{width:64px;flex:none;background:var(--surface);border-radius:10px}
.mas-n{width:64px;aspect-ratio:1;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--surface);color:var(--muted);font-weight:800}
.minis .small{padding-inline:6px}
.rbody{display:grid;gap:6px}
.rname{font-size:1.45rem;font-weight:800}
.meta{display:flex;gap:8px;align-items:flex-start;color:var(--muted)}
.meta .ico{width:1.1em;height:1.1em;margin-top:.2em}
.racts{display:flex;flex-wrap:wrap;gap:10px}
.racts .btn{flex:1 1 0;min-width:0;padding-inline:12px}
.racts .btn.primary{flex-basis:100%}
.racts .btn.soft{font-size:1.05rem;gap:8px}
.aviso{background:var(--accent-soft);box-shadow:none}
.instalar{border:2px solid var(--line);box-shadow:none;background:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.planes-mini{display:grid;gap:10px}
.plan-fila{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);text-align:left}
.plan-fila-txt{display:grid;gap:2px;flex:1;min-width:0}
.plan-fila-txt .small{padding:0}
.plan-fila .ico{color:var(--accent)}
.plan{scroll-margin-top:16px}
.plan.resalta{box-shadow:0 0 0 3px var(--accent),var(--sh-2)}
@media (min-width:720px){.planes-mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.planes-mini{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.9rem;font-weight:700}
.tag.gris{background:var(--bg-2);color:var(--muted)}
.plan .ojo b{color:var(--accent)}
.plan-ej summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:700;list-style:none}
.plan-ej summary::-webkit-details-marker{display:none}
.plan-ej summary::after{content:"";width:9px;height:9px;margin-left:10px;border:solid currentColor;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.plan-ej[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.plan-ej .pasos{margin-top:6px}
.consejos{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:20px;display:grid;gap:14px}
.consejos h2{font-size:1.3rem}
.consejos-lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.consejos-lista li{display:flex;gap:12px;align-items:flex-start}
.consejos-lista .ico{color:var(--ok);margin-top:.15em;stroke-width:2.6}
.descanso-campo .field{border-top:0;padding-top:0}
.pie-rut{justify-content:space-between;align-items:center}
.sonido-btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-weight:700}
.sonido-btn[aria-pressed="true"]{color:var(--accent)}
.sonido-btn.compacto{width:52px;height:52px;padding:0;justify-content:center;background:var(--surface);box-shadow:var(--sh-1)}
.ses-acc{display:flex;align-items:center;gap:8px;flex:none}
.ses-acc .btn{padding-inline:18px}

/* ---------- Editor de rutina ---------- */
.volver{justify-self:start;margin-left:-6px;text-decoration:none}
.editor{display:grid;gap:24px;grid-template-areas:"top" "list" "bottom"}
.ed-side{display:contents}
.ed-top{grid-area:top;display:grid;gap:12px;align-content:start}
.ed-bottom{grid-area:bottom;display:grid;gap:16px;align-content:start}
.ed-list{grid-area:list;min-width:0}
.lab{font-weight:700}
.nombre{width:100%;font:inherit;font-size:1.5rem;font-weight:800;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);padding:10px 14px}
.nombre:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.item{container-type:inline-size;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:14px;display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px 16px;align-items:center}
.figbtn{width:88px;padding:0;border:0;background:none;border-radius:var(--r-s)}
.item .head{display:grid;gap:4px;min-width:0}
.acc{display:flex;flex-wrap:wrap;gap:2px 8px;margin-left:-6px}
.fields{display:grid}
.item .fields{grid-column:1/-1;margin-top:6px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:14px;background:var(--accent-soft);color:var(--accent);transition:transform .12s}
.step button:active{transform:scale(.92)}
.step output{min-width:4.6em;text-align:center;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
@container (min-width:38rem){
  .item .fields{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
  .item .field{flex-direction:column;align-items:stretch;gap:6px;border:0;background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px}
  .item .step{justify-content:space-between}
  .item .step button{width:44px;height:44px}
  .item .step output{min-width:0;flex:1;white-space:nowrap;font-size:1.05rem}
}
.vacio{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:22px;color:var(--muted)}
.sube{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:8px}
.sube button{min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--ok);color:var(--ok-ink);font-weight:700}

/* ---------- Ejercicios ---------- */
.salto{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:10px 16px;background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--sh-1);font-weight:700}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.zona{display:grid;gap:14px;scroll-margin-top:84px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10rem),1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:10px 10px 14px;display:grid;gap:4px;align-content:start;text-align:left;border:0;color:inherit;
  transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s}
.card .figbox{margin-bottom:8px}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}}
.name{font-weight:700;line-height:1.2;padding-inline:4px}
.small{font-size:.95rem;line-height:1.3;padding-inline:4px}

/* ---------- Fichas y hojas ---------- */
dialog{border:0;padding:0;border-radius:20px;background:var(--surface);color:var(--ink);width:min(40rem,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:var(--sh-2)}
dialog.ancho{width:min(64rem,calc(100% - 24px))}
dialog::backdrop{background:rgb(12 16 28 / .5)}
dialog[open]{animation:entra .32s cubic-bezier(.16,1,.3,1)}
dialog[open]::backdrop{animation:velo .32s ease-out}
@keyframes entra{from{transform:translateY(18px) scale(.98)}}
@keyframes velo{from{opacity:0}}
.ficha-fig{position:relative;background:var(--bg-2);aspect-ratio:4/3}
.flot{position:absolute;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--sh-1)}
.flot .ico{width:1.1em;height:1.1em}
.flot.tr{top:12px;right:12px}
.flot.br{bottom:12px;right:12px}
.ficha-body{padding:24px;display:grid;gap:14px;align-content:start}
.ficha-body h3{margin-top:6px}
.pasos{margin:0;padding-left:1.4em;display:grid;gap:8px}
.pasos li::marker{font-weight:800;color:var(--accent)}
.ojo{background:var(--accent-soft);border-radius:var(--r-s);padding:12px 16px}
.ok-txt{color:var(--ok);font-weight:700;min-height:1.5em}
.buscar{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-s);padding:12px 14px}
.buscar:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.hoja-chips{flex-wrap:wrap;overflow:visible}
.picker-list{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:var(--r-s);border:2px solid transparent;background:var(--surface-2)}
.pick .figbox{width:64px;background:var(--surface);border-radius:10px}
.pick-txt{display:grid;gap:2px;min-width:0}
.pick .small{padding:0}
.marca{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.marca .ico{width:20px;height:20px;stroke-width:2.6}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"] .marca{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pie{position:sticky;bottom:-24px;background:var(--surface);padding-block:12px 4px;display:flex;flex-wrap:wrap;gap:12px}
.copia{display:grid;gap:8px}
.codigo{width:100%;font:.95rem/1.4 ui-monospace,Consolas,monospace;word-break:break-all;color:var(--ink);background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-s);padding:10px;resize:vertical}
.error{color:var(--danger);font-weight:700}
.peligro{color:var(--danger)}

/* ---------- Historial ---------- */
.hist{display:grid;gap:32px}
.hist-side,.hist-main{display:grid;gap:28px;align-content:start;min-width:0}
.semana-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:18px;display:grid;gap:14px}
.semana-card h2{font-size:1.25rem}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.dia{display:grid;justify-items:center;gap:6px}
.bola{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);font-weight:700;font-variant-numeric:tabular-nums}
.dia.on .bola{background:var(--ok);color:var(--ok-ink)}
.dia.hoy .bola{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.entradas{display:grid;gap:10px}
.entrada{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-1);padding:0 18px}
.entrada[open]{padding-bottom:12px}
.entrada summary{cursor:pointer;min-height:60px;padding-block:12px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;list-style:none}
.entrada summary::-webkit-details-marker{display:none}
.entrada summary::after{content:"Ver";margin-left:auto;color:var(--accent);font-weight:700}
.entrada[open] summary::after{content:"Ocultar"}
.cuando{font-weight:700}
.que{color:var(--muted)}
.chip-inline{background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:700;padding:2px 10px;border-radius:999px}
.hechos{margin:0 0 6px;padding-left:1.2em;display:grid;gap:4px}

/* ---------- Entreno ---------- */
#entreno{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ent{display:grid;gap:16px;justify-items:center;text-align:center;padding-block:24px 40px}
.ent-fig{width:min(100%,50vh,30rem);aspect-ratio:1;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--sh-1)}
.ses{max-width:72rem;display:grid;gap:16px;padding-block:0 calc(200px + env(safe-area-inset-bottom,0px))}
.ses-top{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;box-shadow:0 1px 0 var(--line)}
.ses-tit{display:grid;min-width:0}
.ses-tit b{line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.reloj-ses{font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.tira{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}

<script>

const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)));
const codigo=r=>'r-'+b64e(JSON.stringify({n:r.nombre,d:r.descanso||60,i:r.items.map(i=>[i.id,i.series,i.reps,Math.round(i.kg*2)].join('.')).join('_')}));
function leerCodigo(txt){
  const m=String(txt).match(/(?:^|[#\s])r-([A-Za-z0-9_-]{8,})/);if(!m)return null;
  try{
    const o=JSON.parse(b64d(m[1]));
    const items=String(o.i||'').split('_').map(s=>{const[id,se,re,kg]=s.split('.');
      return{id,series:num(+se,1,10,3),reps:num(+re,1,50,10),kg:num(+kg/2,0,40,0)}}).filter(i=>byId[i.id]);
    return items.length?{nombre:String(o.n||'Rutina').trim().slice(0,60)||'Rutina',items,descanso:num(+o.d,15,300,60)}:null;
  }catch{return null}
}

    else if(k==='class')e.className=v;

  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}

}

const conTxt=ex=>ex.con||'Mancuernas, o botellas de agua llenas: una de 1,5 litros pesa 1,5 kg.';
function proximo(it,ex){
  if(ex.peso!==false)return it.reps<12?{reps:it.reps+1}:{kg:it.kg+(it.kg<5?.5:1),reps:8};
  return it.reps<15?{reps:it.reps+1}:it.series<4?{series:it.series+1}:null;
}
function sugerir(r,it,ex){
  const e=S.historial.find(x=>x.rid===r.id&&x.items.some(i=>i.id===it.id));
  const hecho=e&&e.completa&&e.items.find(i=>i.id===it.id);
  if(!hecho||hecho.sets.length<it.series||hecho.sets.some(z=>z.reps<it.reps||z.kg<it.kg))return null;
  const n=proximo(it,ex);if(!n)return null;
  const txt=n.kg!=null?`${kgTxt(n.kg)} y ${n.reps} repeticiones`:n.reps!=null?`${n.reps} repeticiones`:`${n.series} series`;
  return h('div',{class:'sube'},h('span',{class:'muted small'},'La última vez lo hiciste todo.'),
    h('button',{type:'button',onclick(){Object.assign(it,n);save();render()}},`Subir a ${txt}`));
}

function elegir(r){
  const sel=[];let filtro='',zona=null;
  const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const boton=h('button',{class:'btn primary',type:'button',onclick(){if(!sel.length)return;r.items.push(...sel.map(id=>({id,...byId[id].def})));save();sonar('pop');dlg.close()}});
  const filas=EX.map(ex=>{
    const b=h('button',{class:'pick',type:'button','aria-pressed':'false'},
      figBox(ex,{play:false,e:HOLD+dur(ex)+.1}),
      h('span',{class:'pick-txt'},h('b',{},ex.nombre),h('span',{class:'muted small'},ex.musculos)),
      h('span',{class:'marca','aria-hidden':'true'},ico('check')));
    b.onclick=()=>{const k=sel.indexOf(ex.id);if(k<0)sel.push(ex.id);else sel.splice(k,1);b.setAttribute('aria-pressed',String(k<0));pintar()};
    return[ex,b];
  });
  const pintar=()=>{
    boton.textContent=sel.length?`Añadir ${plural(sel.length,'ejercicio','ejercicios')}`:'Marca los que quieras';
    for(const[ex,b]of filas)b.hidden=!((!zona||ex.zona===zona)&&(!filtro||norm(ex.nombre+' '+ex.musculos).includes(filtro)));
  };
  const chips=h('div',{class:'chips hoja-chips'},[null,...ZONAS].map(z=>{
    const c=h('button',{type:'button','aria-pressed':String(z===zona)},z||'Todos');
    c.onclick=()=>{zona=z;for(const x of chips.children)x.setAttribute('aria-pressed',String(x===c));pintar()};
    return c;
  }));
  hoja(h('h2',{},`Añadir a «${r.nombre}»`),
    h('input',{class:'buscar',type:'search',placeholder:'Buscar ejercicio','aria-label':'Buscar ejercicio',oninput(){filtro=norm(this.value.trim());pintar()}}),
    chips,h('div',{class:'picker-list'},filas.map(f=>f[1])),
    h('div',{class:'pie'},boton,h('button',{class:'btn ghost',type:'button',onclick:()=>dlg.close()},'Cancelar')));
  pintar();
}

  const ta=h('textarea',{class:'codigo',readonly:true,rows:3,'aria-label':label});ta.value=txt;

    const fallo=()=>{ta.focus();ta.select();b.textContent='Selecciónalo y cópialo'};
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copiado'},fallo)}catch{fallo()}
  }},`Copiar ${label.toLowerCase()}`);
  return h('div',{class:'copia'},ta,h('div',{},b));
}
function compartir(r){
  const cod=codigo(r),url=`${base()}#${cod}`;
  const msg=`Te paso la rutina «${r.nombre}». Ábrela con este enlace y se guardará en tu móvil: ${url}`;
  hoja(h('h2',{},`Compartir «${r.nombre}»`),
    h('p',{},'Envía este enlace. Al abrirlo en otro móvil, la rutina se guarda allí y se puede empezar enseguida.'),
    h('div',{},h('a',{class:'btn primary',href:'https://wa.me/?text='+encodeURIComponent(msg),target:'_blank',rel:'noopener'},'Enviar por WhatsApp')),
    copiable('Enlace',url),
    h('p',{class:'muted'},'Si el enlace no abre la rutina, en Rutinas pulsa «Tengo un código» y pega este código:'),
    copiable('Código',cod),

}

  const ta=h('textarea',{class:'codigo',id:'pegar',rows:4,'aria-label':'Enlace o código'});
  const err=h('p',{class:'error',hidden:true},'No reconozco ese código. Copia el mensaje entero que te enviaron y pégalo aquí.');
  hoja(h('h2',{},'Pegar una rutina'),h('p',{},'Pega aquí el enlace o el código que te han enviado.'),ta,err,
    h('div',{class:'row'},
      h('button',{class:'btn primary',type:'button',onclick(){const d=leerCodigo(ta.value);if(d)guardarImport(d);else err.hidden=false}},'Guardar la rutina'),
      h('button',{class:'btn ghost',type:'button',onclick:()=>dlg.close()},'Cancelar')));
  ta.focus();
}
function ofrecerImport(d){
  if(!d)return hoja(h('h2',{},'Este enlace no trae una rutina válida'),h('p',{},'Pide que te lo vuelvan a enviar.'),
    h('div',{},h('button',{class:'btn primary',type:'button',onclick:()=>dlg.close()},'Vale')));
  const ya=S.rutinas.some(r=>codigo(r)===codigo(d));
  hoja(h('h2',{},'Te han pasado una rutina'),
    h('p',{},h('b',{},d.nombre),`, ${plural(d.items.length,'ejercicio','ejercicios')}:`),
    h('ul',{class:'hechos'},d.items.map(i=>h('li',{},`${byId[i.id].nombre}: ${plural(i.series,'serie','series')} de ${i.reps}`+(i.kg?`, ${kgTxt(i.kg)}`:'')))),
    ya&&h('p',{class:'muted'},'Ya la tienes guardada.'),
    h('div',{class:'row'},
      h('button',{class:'btn primary',type:'button',onclick:()=>guardarImport(d)},ya?'Abrirla':'Guardar en mis rutinas'),
      h('button',{class:'btn ghost',type:'button',onclick:()=>dlg.close()},'Ahora no')));
}

// ---------- Historial ----------
function vistaHistorial(){
  const H=S.historial;
  if(!H.length)return h('section',{class:'intro'},h('h1',{},'Historial'),
    h('p',{class:'muted'},'Aún no hay entrenos. Cuando hagas una rutina aparecerá aquí, con el día y lo que hiciste.'),
    h('button',{class:'btn primary',type:'button',onclick:()=>show('rutinas')},'Ir a mis rutinas'));
  const hechos=new Set(H.map(e=>new Date(e.t).toDateString()));
  const dias=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5));
  const ahora=new Date(),mes=H.filter(e=>{const d=new Date(e.t);return d.getMonth()===ahora.getMonth()&&d.getFullYear()===ahora.getFullYear()});
  const grupos=new Map();
  for(const e of H){const k=cap(new Date(e.t).toLocaleDateString('es-ES',{month:'long',year:'numeric'}));if(!grupos.has(k))grupos.set(k,[]);grupos.get(k).push(e)}
  return h('div',{class:'hist'},h('div',{class:'hist-side'},
    h('section',{class:'intro'},h('h1',{},'Historial'),
      h('p',{class:'muted'},`Este mes llevas ${plural(mes.length,'entreno','entrenos')} y ${plural(mes.reduce((t,e)=>t+e.mins,0),'minuto','minutos')} de ejercicio.`)),
    h('section',{class:'semana-card'},h('h2',{},'Últimos 7 días'),
      h('div',{class:'semana'},dias.map((d,i)=>h('div',{class:'dia'+(hechos.has(d.toDateString())?' on':'')+(i===6?' hoy':'')},
        h('span',{class:'muted small'},cap(d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.',''))),
        h('span',{class:'bola','aria-label':hechos.has(d.toDateString())?'Entrenaste':'Sin entreno'},d.getDate())))))),
    h('div',{class:'hist-main'},[...grupos].map(([k,es])=>h('section',{class:'zona'},h('h2',{},k),h('div',{class:'entradas'},es.map(entrada))))));
}
function entrada(e){
  const d=new Date(e.t);
  return h('details',{class:'entrada'},
    h('summary',{},
      h('span',{class:'cuando'},cap(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric'}))+', '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})),
      h('span',{class:'que'},`${e.nombre}, ${plural(e.mins,'minuto','minutos')}`),
      !e.completa&&h('span',{class:'chip-inline'},'Sin terminar')),
    h('ul',{class:'hechos'},e.items.map(i=>h('li',{},h('b',{},byId[i.id]?byId[i.id].nombre:i.id),`: ${setsTxt(i.sets)}`))),
    dosVeces('Borrar del historial',()=>{S.historial=S.historial.filter(x=>x!==e);save();render()}));
}

// ---------- Entreno: series libres con kg, repeticiones y check; descanso al marcar ----------
// La sesión vive en S.sesion y se guarda con cada cambio, así sobrevive a recargar o bloquear el móvil.
const ent=document.getElementById('entreno');
let E=null,ac=null,lock=null,tic=null,rest=null,reloj=null;
// Sonidos sintetizados con Web Audio (sin archivos): notas de campanilla [frecuencia Hz, inicio s, duración s]
const SONIDOS={
  empezar:[[523,0],[659,.09],[784,.18],[1047,.27,.35]],
  hecha:[[784,0,.1],[1175,.08,.3]],
  ejercicio:[[659,0],[880,.1],[1319,.2,.5]],
  quitar:[[440,0,.12],[349,.08,.2]],
  pasar:[[660,0,.14]],
  descanso:[[880,0,.16],[880,.28,.16],[1175,.56,.45]],
  fin:[[523,0],[659,.12],[784,.24],[1047,.36,.2],[784,.58,.12],[1047,.72,.9],[1319,.72,.9],[1568,.72,.9]],
  guardado:[[659,0,.2],[523,.16,.4]],
  pop:[[880,0,.06],[1320,.06,.14]]};
function sonar(n){
  if(S.mudo)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+.02,out=ac.createGain();out.gain.value=.5;out.connect(ac.destination);
    for(const[f,t,d=.16]of SONIDOS[n]){
      const a=t0+t,g=ac.createGain(),arm=ac.createGain();arm.gain.value=.22;  // un armónico suave da el timbre de campanilla
      g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.45,a+.012);g.gain.exponentialRampToValueAtTime(.0001,a+d+.3);
      g.connect(out);
      for(const[k,dest]of[[1,g],[2,arm]]){const o=ac.createOscillator();o.frequency.value=f*k;o.connect(dest);o.start(a);o.stop(a+d+.35)}
      arm.connect(g);
    }
  }catch{}
}
const vibrar=ms=>{try{S.mudo||navigator.vibrate&&navigator.vibrate(ms)}catch{}};
// Interruptor de sonido (se recuerda en este dispositivo)
function botonSonido(compacto){
  const b=h('button',{class:'sonido-btn'+(compacto?' compacto':''),type:'button',onclick(){S.mudo=!S.mudo;save();pintar();sonar('pop')}});
  const pintar=()=>{b.replaceChildren(ico(S.mudo?'mudo':'sonido'),...(compacto?[]:[S.mudo?'Sonidos desactivados':'Sonidos activados']));
    b.setAttribute('aria-pressed',String(!S.mudo));b.setAttribute('aria-label',S.mudo?'Activar sonidos':'Silenciar sonidos')};
  pintar();return b;
}
const reloj2=s=>{s=Math.max(0,Math.floor(s));const hh=Math.floor(s/3600),m=Math.floor(s/60)%60,ss=String(s%60).padStart(2,'0');return hh?`${hh}:${String(m).padStart(2,'0')}:${ss}`:`${m}:${ss}`};
const contar=it=>`${it.sets.filter(z=>z.done).length}/${it.sets.length}`;
function anterior(id){const e=S.historial.find(x=>x.items.some(i=>i.id===id));return e?e.items.find(i=>i.id===id).sets:[]}
function empezar(r){
  const nueva=()=>{
    S.sesion={rid:r.id,nombre:r.nombre,t0:Date.now(),i:0,descanso:r.descanso||60,items:r.items.map(it=>({id:it.id,
      sets:Array.from({length:it.series},()=>({kg:byId[it.id].peso===false?0:it.kg,reps:it.reps,done:false}))}))};
    save();abrirSesion();
  };
  if(!S.sesion)return nueva();
  hoja(h('h2',{},'Tienes un entreno a medias'),h('p',{},`De «${S.sesion.nombre}». Si empiezas uno nuevo, ese se pierde.`),
    h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick(){dlg.close();abrirSesion()}},'Continuar el de antes'),
      h('button',{class:'btn ghost',type:'button',onclick(){dlg.close();nueva()}},'Empezar uno nuevo')));
}
function abrirSesion(){
  E=S.sesion;
  sonar('empezar');
  try{navigator.wakeLock.request('screen').then(l=>{lock=l}).catch(()=>{})}catch{}
  ent.hidden=false;document.body.classList.add('modo-entreno');
  clearInterval(tic);tic=setInterval(latido,1000);
  pintarSesion();
}
function cerrarSesion(){
  clearInterval(tic);rest=null;pintarDescanso();
  try{lock&&lock.release()}catch{}
  lock=null;E=null;ent.hidden=true;document.body.classList.remove('modo-entreno');render();
}
// Barra de descanso fija abajo; aparece al marcar una serie
const dTxt=h('span',{class:'d-txt'}),dProg=h('i',{class:'d-prog'});
const descBar=h('div',{class:'descanso-bar',hidden:true},dProg,dTxt,
  h('button',{class:'bar-btn',type:'button','aria-label':'Quitar 15 segundos',onclick(){if(rest){rest.until-=15e3;latido()}}},'−15'),
  h('button',{class:'bar-btn',type:'button','aria-label':'Añadir 15 segundos',onclick(){if(rest){rest.until+=15e3;rest.total+=15;latido()}}},'+15'),
  h('button',{class:'bar-btn',type:'button',onclick(){rest=null;pintarDescanso()}},'Saltar'));
function pintarDescanso(left){
  descBar.hidden=!rest;if(!rest)return;
  left=Math.max(0,left??Math.ceil((rest.until-Date.now())/1000));
  dTxt.textContent=`Descanso ${reloj2(left)}`;dProg.style.width=`${left/rest.total*100}%`;
}
function latido(){
  if(!E)return;
  if(reloj)reloj.textContent=reloj2((Date.now()-E.t0)/1000);
  if(rest){const left=Math.ceil((rest.until-Date.now())/1000);if(left<=0){rest=null;sonar('descanso');vibrar([120,80,120])}pintarDescanso(left)}
}
function filaSerie(it,z,k,a,conPeso,tira){
  const kg=conPeso&&h('input',{type:'number',inputmode:'decimal',step:'0.5',min:'0',max:'200',value:z.kg,'aria-label':`Kilos de la serie ${k+1}`,
    oninput(){z.kg=num(parseFloat(this.value.replace(',','.')),0,200,0);save()}});
  const reps=h('input',{type:'number',inputmode:'numeric',min:'0',max:'200',value:z.reps,'aria-label':`Repeticiones de la serie ${k+1}`,
    oninput(){z.reps=num(parseInt(this.value,10),0,200,0);save()}});
  const fila=h('div',{class:'serie'+(conPeso?'':' sinpeso')+(z.done?' hecha':'')},
    h('span',{class:'n'},k+1),
    a?h('button',{class:'ant',type:'button','aria-label':`Usar lo de la última vez: ${serieTxt(a)}`,onclick(){
        z.reps=a.reps;reps.value=a.reps;if(kg){z.kg=a.kg;kg.value=a.kg}save()}},serieTxt(a)):h('span',{class:'ant'},'—'),
    kg,reps,
    h('button',{class:'check',type:'button','aria-pressed':String(z.done),'aria-label':`Serie ${k+1} hecha`,onclick(){
      z.done=!z.done;fila.classList.toggle('hecha',z.done);this.setAttribute('aria-pressed',String(z.done));save();
      const b=tira.children[E.i];b.querySelector('small').textContent=contar(it);b.classList.toggle('ok',it.sets.every(x=>x.done));
      if(z.done){const d=E.descanso||60;rest={until:Date.now()+d*1e3,total:d};pintarDescanso(d);sonar(it.sets.every(x=>x.done)?'ejercicio':'hecha');vibrar(30)}
      else sonar('quitar');
    }},ico('check')));
  return fila;
}
function pintarSesion(){
  const it=E.items[E.i],x=byId[it.id],ant=anterior(it.id),conPeso=x.peso!==false;
  const ir=k=>{if(k!==E.i)sonar('pasar');E.i=k;save();pintarSesion()};
  reloj=h('span',{class:'reloj-ses'},reloj2((Date.now()-E.t0)/1000));
  const tira=h('div',{class:'tira'},E.items.map((s,k)=>{
    const b=zona(h('button',{type:'button','aria-current':String(k===E.i),onclick:()=>ir(k)},h('i',{class:'tira-dot'}),byId[s.id].nombre,h('small',{},contar(s))),byId[s.id]);
    b.classList.toggle('ok',s.sets.every(z=>z.done));return b;
  }));
  const f=figure(x,{db:x.db&&it.sets.some(z=>z.kg>0),girar:true});
  ent.replaceChildren(h('div',{class:'wrap ses'},
    h('div',{class:'ses-top'},h('div',{class:'ses-tit'},h('b',{},E.nombre),reloj),
      h('div',{class:'ses-acc'},botonSonido(true),h('button',{class:'btn ghost',type:'button',onclick:terminar},'Terminar'))),
    tira,
    h('div',{class:'ses-grid'},h('div',{class:'ses-demo'},zona(h('div',{class:'ent-fig'},f.node),x),
    h('div',{class:'ses-head'},h('h2',{},x.nombre),h('button',{class:'link',type:'button',onclick:()=>ficha(x,{solo:true})},'Cómo se hace'))),
    h('div',{class:'ses-sets'},
    h('div',{class:'series'},
      h('div',{class:'serie cab'+(conPeso?'':' sinpeso'),'aria-hidden':'true'},h('span',{},'Nº'),h('span',{},'Antes'),conPeso&&h('span',{},'kg'),h('span',{},'Reps'),h('span',{},'Hecha')),
      it.sets.map((z,k)=>filaSerie(it,z,k,ant[k],conPeso,tira))),
    h('div',{class:'row'},
      h('button',{class:'btn ghost',type:'button',onclick(){const u=it.sets[it.sets.length-1]||{kg:0,reps:10};it.sets.push({kg:u.kg,reps:u.reps,done:false});save();pintarSesion()}},ico('mas'),'Añadir serie'),
      it.sets.length>1&&h('button',{class:'link',type:'button',onclick(){it.sets.pop();save();pintarSesion()}},'Quitar la última')),
    h('div',{class:'row nav-ses'},
      E.i>0&&h('button',{class:'btn ghost',type:'button',onclick:()=>ir(E.i-1)},'Anterior'),
      E.i<E.items.length-1
        ?h('button',{class:'btn primary',type:'button',onclick:()=>ir(E.i+1)},`Siguiente: ${byId[E.items[E.i+1].id].nombre}`)
        :h('button',{class:'btn primary',type:'button',onclick:terminar},'Terminar entreno'))))),
    descBar);
  pintarDescanso();
  ent.scrollTop=0;
  tira.children[E.i].scrollIntoView({block:'nearest',inline:'center'});
}
function terminar(){
  const total=E.items.reduce((t,i)=>t+i.sets.length,0),hechas=E.items.reduce((t,i)=>t+i.sets.filter(z=>z.done).length,0);
  hoja(h('h2',{},'¿Terminar el entreno?'),
    h('p',{},`Has marcado ${hechas} de ${plural(total,'serie','series')}.`+(hechas<total?' Las que no están marcadas no se guardan.':'')),
    h('div',{class:'row'},
      hechas>0&&h('button',{class:'btn primary',type:'button',onclick(){dlg.close();guardarSesion(hechas===total)}},'Terminar y guardar'),
      h('button',{class:'btn ghost',type:'button',onclick:()=>dlg.close()},'Seguir entrenando')),
    h('div',{},dosVeces('Descartar este entreno',()=>{S.sesion=null;save();dlg.close();cerrarSesion()})));
}
function guardarSesion(completa){
  const items=E.items.map(i=>({id:i.id,sets:i.sets.filter(z=>z.done).map(({kg,reps})=>({kg,reps}))})).filter(i=>i.sets.length);
  const e={t:E.t0,rid:E.rid,nombre:E.nombre,mins:Math.min(240,Math.max(1,Math.round((Date.now()-E.t0)/6e4))),completa,items};
  S.historial.unshift(e);S.sesion=null;save();
  sonar(completa?'fin':'guardado');
  clearInterval(tic);rest=null;pintarDescanso();
  const r=rut(e.rid),series=items.reduce((t,i)=>t+i.sets.length,0);
  // Como en Chuzado: si cambió pesos o repeticiones, ofrece guardarlos en la rutina
  // Las series cuentan todas las de la sesión (también las añadidas), no solo las marcadas
  const total=Object.fromEntries(E.items.map(i=>[i.id,i.sets.length]));
  const plan=i=>r&&r.items.find(x=>x.id===i.id),ult=i=>i.sets[i.sets.length-1];
  const cambios=items.filter(i=>{const p=plan(i);return p&&(ult(i).kg!==p.kg||ult(i).reps!==p.reps||total[i.id]!==p.series)});
  const act=cambios.length>0&&h('button',{class:'btn ghost',type:'button',onclick(){
    for(const i of cambios)Object.assign(plan(i),{kg:ult(i).kg,reps:ult(i).reps,series:Math.min(10,total[i.id])});
    save();act.textContent='Rutina actualizada';act.disabled=true;
  }},'Guardar los pesos de hoy en la rutina');
  ent.replaceChildren(h('div',{class:'wrap ent'},
    h('div',{class:'ent-fig'},figure(byId.press,{girar:true}).node),
    h('h2',{},completa?'¡Rutina terminada!':'Entreno guardado'),
    h('p',{},`${plural(series,'serie','series')} de ${plural(items.length,'ejercicio','ejercicios')} en ${plural(e.mins,'minuto','minutos')}. Bebe un poco de agua.`),
    act&&h('p',{class:'muted'},'Hoy has cambiado algún peso o alguna repetición respecto a la rutina.'),act,
    h('div',{class:'row center'},
      h('button',{class:'btn primary big',type:'button',onclick:cerrarSesion},'Volver a mis rutinas'),
      h('button',{class:'btn ghost',type:'button',onclick(){cerrarSesion();show('historial')}},'Ver historial'))));
  ent.scrollTop=0;
}

// ---------- Instalar como app ----------
// Fuera del Artifact (p. ej. GitHub Pages) se registra el service worker y se ofrece instalarla.
const suelta=window.top===window.self&&/^https?:$/.test(location.protocol);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const esIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let instalar=null;
if(suelta&&'serviceWorker'in navigator){
  const habia=!!navigator.serviceWorker.controller;let recargado=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(habia&&!recargado){recargado=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalar=e;if(vista==='rutinas')render()});
addEventListener('appinstalled',()=>{instalar=null;render()});
function avisoInstalar(){
  if(!suelta||instalada())return null;
  if(instalar)return h('article',{class:'rcard instalar'},
    h('div',{class:'rbody'},h('h3',{class:'rname'},'Tenla como una app'),
      h('p',{class:'muted'},'Instálala y tendrás EntrenaEnCasa en la pantalla de inicio, a pantalla completa y también sin internet.')),
    h('div',{},h('button',{class:'btn primary',type:'button',async onclick(){const e=instalar;instalar=null;e.prompt();await e.userChoice.catch(()=>{});render()}},ico('descargar'),'Instalar EntrenaEnCasa')));
  if(esIOS)return h('article',{class:'rcard instalar'},
    h('div',{class:'rbody'},h('h3',{class:'rname'},'Tenla como una app'),
      h('p',{class:'muted'},'En el iPhone o el iPad: pulsa el botón Compartir de Safari y luego «Añadir a pantalla de inicio».')));
  return null;
}

// ---------- Arranque ----------
const hs=location.hash.slice(1);
if(['planes','ejercicios','historial'].includes(hs))vista=hs;
render();
if(hs.startsWith('r-')){try{history.replaceState(null,'','#rutinas')}catch{}ofrecerImport(leerCodigo('#'+hs))}
</script>
